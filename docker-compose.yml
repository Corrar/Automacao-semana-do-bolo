# WAHA dedicado do Bolo (waha-bolo), isolado do WAHA do suporte Royale.
#
# A LÓGICA do bolo agora vive no workflow do n8n ("Bolo da Sexta — Pagamentos").
# Este compose sobe APENAS o WAHA dedicado — não rode o app Node junto, senão
# haverá envio duplicado (o app Node é uma implementação alternativa/legada).
#
# Fluxo de rede:
#  - waha-bolo -> n8n: via webhook público (WHATSAPP_HOOK_URL).
#  - n8n -> waha-bolo: pelo nome de serviço `waha-bolo:3000` (mesma rede do n8n).
services:
  waha-bolo:
    image: devlikeapro/waha:latest
    container_name: waha-bolo
    restart: unless-stopped
    ports:
      # Dashboard/API do WAHA do Bolo em http://SEU_HOST:3001
      # (3001 no host para não colidir com o WAHA do Royale).
      - '3001:3000'
    environment:
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
      # Webhook: eventos de mensagem vão para o workflow do n8n.
      - WHATSAPP_HOOK_URL=${WAHA_HOOK_URL}
      - WHATSAPP_HOOK_EVENTS=message
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:-admin}
    volumes:
      - waha-bolo-sessions:/app/.sessions
    networks:
      - n8n-net

networks:
  # Rede EXTERNA já usada pelo n8n, para que o n8n alcance http://waha-bolo:3000.
  # Descubra o nome com: docker network ls  (ex.: root_default, n8n_default...)
  # e informe em N8N_NETWORK no .env.
  n8n-net:
    external: true
    name: ${N8N_NETWORK:-n8n_default}

volumes:
  waha-bolo-sessions:
