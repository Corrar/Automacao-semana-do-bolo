# WAHA dedicado + app do Bolo, totalmente isolados do WAHA do suporte Royale.
# Rede, sessão, volume e API key próprios — nada é compartilhado.
services:
  # WAHA exclusivo do Bolo. Conecte AQUI o número +55 18 99812-6464.
  waha-bolo:
    image: devlikeapro/waha:latest
    container_name: waha-bolo
    restart: unless-stopped
    ports:
      # Dashboard/API do WAHA do Bolo em http://SEU_HOST:3001
      # (3001 no host para não colidir com o WAHA do Royale).
      - '3001:3000'
    environment:
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
      # Sem WHATSAPP_HOOK_URL de propósito: o Bolo só ENVIA mensagens,
      # não precisa receber webhooks (e assim nada é encaminhado a lugar nenhum).
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:-admin}
    volumes:
      - waha-bolo-sessions:/app/.sessions
    networks:
      - bolo-net

  app:
    build: .
    container_name: bolo-app
    restart: unless-stopped
    depends_on:
      - waha-bolo
    environment:
      - PORT=3000
      - DATABASE_URL=file:/app/data/dev.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Comunicação interna com o WAHA do Bolo (nome do serviço na rede).
      - WAHA_URL=http://waha-bolo:3000
      - WAHA_SESSION=default
      - WAHA_API_KEY=${WAHA_API_KEY}
      - GROUP_CHAT_ID=${GROUP_CHAT_ID}
      - TIMEZONE=America/Sao_Paulo
    volumes:
      - bolo-data:/app/data
    networks:
      - bolo-net

networks:
  bolo-net:
    driver: bridge

volumes:
  waha-bolo-sessions:
  bolo-data:
